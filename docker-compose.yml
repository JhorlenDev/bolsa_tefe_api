services:
  postgres:
    image: postgres:15
    container_name: bolsa_tefe_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-bolsa_tefe}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: bolsa_tefe_adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  postgres_data:
